# Original MultiON MP3D episodes on stock Habitat-Lab.  Goal cylinders are
# registered through ``additional_object_paths`` and spawned by the portable
# task with Habitat-Sim's rigid-object manager.
defaults:
  - /benchmark/nav/pointnav: pointnav_mp3d
  - /habitat/task/measurements: nav_eval_multion_sub_success
  - _self_

habitat:
  environment:
    max_episode_steps: 2500
  simulator:
    additional_object_paths:
      - data/objects/multion
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 256
            height: 256
            hfov: 79
          depth_sensor:
            width: 256
            height: 256
            hfov: 79
            normalize_depth: false
  task:
    type: NavEvalMultiON-v1
    lab_sensors: {}
    actions:
      found:
        type: NavEvalFoundAction
    measurements:
      multion_path_length:
        type: NavEvalMultiONPathLength
      multion_distance_to_currgoal:
        type: NavEvalMultiONDistance
      multion_sub_success:
        type: NavEvalMultiONSubSuccess
        success_distance: 1.5
      progress:
        type: NavEvalMultiONProgress
      success:
        type: NavEvalMultiONSuccess
      mspl:
        type: NavEvalMultiONMSPL
      ppl:
        type: NavEvalMultiONPPL
  dataset:
    type: NavEvalMultiON-v1
    split: val
    data_path: data/datasets/multinav/3_ON/val/val.json.gz
    scenes_dir: data/scene_datasets
