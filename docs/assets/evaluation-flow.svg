<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The Nav-Eval evaluation pipeline</title>
  <desc id="desc">Choose compatible method and benchmark plugins, resolve and validate the configuration, run episodes with isolated model and simulator workers, then commit trajectories and score them offline. Saved runs support resume and rescoring.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" stroke="#718697" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="20" fill="#f6f8fb" stroke="#dce4eb"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="39" fill="#526579" font-size="12" font-weight="700" letter-spacing="2">ONE SHARED EVALUATION PIPELINE</text>
    <text x="1170" y="39" fill="#526579" font-size="12" text-anchor="end">Configure → execute → inspect</text>
    <g fill="#fff" stroke="#dce4eb">
      <rect x="30" y="61" width="259" height="158" rx="12"/>
      <rect x="324" y="61" width="259" height="158" rx="12"/>
      <rect x="618" y="61" width="259" height="158" rx="12"/>
      <rect x="912" y="61" width="258" height="158" rx="12"/>
    </g>
    <g stroke="#718697" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M296 140H316"/>
      <path d="M590 140H610"/>
      <path d="M884 140H904"/>
    </g>
    <g fill="#e9f6f1">
      <rect x="49" y="80" width="36" height="36" rx="10"/>
      <rect x="343" y="80" width="36" height="36" rx="10"/>
      <rect x="637" y="80" width="36" height="36" rx="10"/>
      <rect x="931" y="80" width="36" height="36" rx="10"/>
    </g>
    <g stroke="#137a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="58" y="89" width="7" height="7" rx="1"/>
      <rect x="69" y="89" width="7" height="7" rx="1"/>
      <rect x="58" y="100" width="7" height="7" rx="1"/>
      <rect x="69" y="100" width="7" height="7" rx="1"/>
      <path d="M352 91L354 93L358 88M362 91H370M352 101L354 103L358 98M362 101H370"/>
      <rect x="645" y="88" width="20" height="8" rx="2"/>
      <rect x="645" y="101" width="20" height="8" rx="2"/>
      <path d="M649 92H649.1M649 105H649.1M940 89V107H959M945 102V98M951 102V94M957 102V88"/>
    </g>
    <g fill="#718697" font-size="12" font-weight="700" text-anchor="end">
      <text x="268" y="102">01</text>
      <text x="562" y="102">02</text>
      <text x="856" y="102">03</text>
      <text x="1149" y="102">04</text>
    </g>
    <g fill="#152d42" font-size="21" font-weight="700">
      <text x="49" y="147">Compose</text>
      <text x="343" y="147">Validate</text>
      <text x="637" y="147">Run</text>
      <text x="931" y="147">Evaluate</text>
    </g>
    <g fill="#526579" font-size="14">
      <text x="49" y="175">Method + benchmark</text>
      <text x="49" y="196">Discover plugin manifests</text>
      <text x="343" y="175">Sensors, actions, resources</text>
      <text x="343" y="196">Resolve a frozen plan</text>
      <text x="637" y="175">Model + simulator workers</text>
      <text x="637" y="196">Execute episode queues</text>
      <text x="931" y="175">Commit trajectories</text>
      <text x="931" y="196">Score saved evidence</text>
    </g>
    <path d="M49 251H63M56 244V258" stroke="#137a62" stroke-width="1.8" stroke-linecap="round"/>
    <text x="76" y="256" fill="#526579" font-size="14">Compatible goals, sensors, and actions</text>
    <path d="M694 252A7 7 0 1 1 697 257M694 246V252H700" stroke="#137a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="715" y="256" fill="#526579" font-size="14">Resume unfinished runs · Rescore offline</text>
  </g>
</svg>
