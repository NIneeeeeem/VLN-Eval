[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nav-eval"
version = "0.2.0"
description = "Manifest-driven navigation evaluation runtime"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nav-eval = "nav_eval.cli:main"

[tool.setuptools.packages.find]
include = ["nav_eval*", "extensions*"]

[tool.setuptools.package-data]
"*" = ["manifest.json", "*.manifest.json"]
