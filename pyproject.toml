[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nav-eval"
version = "0.3.0"
description = "Manifest-driven navigation evaluation runtime"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nav-eval = "nav_eval.cli:main"

[tool.setuptools.packages.find]
include = ["nav_eval*", "extensions*"]
exclude = ["extensions.benchmarks.*.runtime*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.jinja", "*.txt", "notices/**/*"]
